<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Penny & Co.</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background: #f5f1e8;
            color: #171717;
            font-family: Georgia, "Times New Roman", serif;
            overflow: hidden;
        }

        header {
            height: 70px;
            padding: 0 7%;
            border-bottom: 1px solid #171717;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .logo span {
            font-style: italic;
        }

        nav {
            display: flex;
            gap: 30px;
        }

        nav a {
            color: #171717;
            text-decoration: none;
            font-family: Arial, sans-serif;
            font-size: 11px;
            letter-spacing: 2px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .main {
            height: calc(100vh - 120px);

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;
            padding: 20px;
        }

        .tag {
            font-family: Arial, sans-serif;
            font-size: 11px;
            letter-spacing: 3px;
            margin-bottom: 18px;
        }

        h1 {
            font-size: clamp(55px, 8vw, 90px);
            font-weight: normal;
            line-height: 0.95;
        }

        h1 em {
            font-style: italic;
        }

        .description {
            max-width: 500px;
            margin-top: 25px;

            font-family: Arial, sans-serif;
            font-size: 15px;
            line-height: 1.6;
        }

        button {
            margin-top: 25px;
            padding: 13px 28px;

            background: #171717;
            color: white;

            border: 1px solid #171717;

            font-family: Arial, sans-serif;
            font-size: 10px;
            letter-spacing: 2px;

            cursor: pointer;
        }

        button:hover {
            background: transparent;
            color: #171717;
        }

        .info {
            display: flex;
            justify-content: center;
            gap: 100px;

            margin-top: 45px;
            padding-top: 25px;

            border-top: 1px solid #171717;

            width: 70%;
        }

        .info div {
            text-align: center;
        }

        .info h3 {
            font-size: 18px;
            font-weight: normal;
            margin-bottom: 8px;
        }

        .info p {
            font-family: Arial, sans-serif;
            font-size: 12px;
            line-height: 1.5;
        }

        footer {
            height: 50px;
            padding: 0 7%;

            border-top: 1px solid #171717;

            display: flex;
            align-items: center;
            justify-content: space-between;

            font-family: Arial, sans-serif;
            font-size: 9px;
            letter-spacing: 2px;
        }

        @media (max-width: 600px) {

            header {
                padding: 0 5%;
            }

            nav {
                gap: 12px;
            }

            nav a {
                font-size: 8px;
            }

            h1 {
                font-size: 55px;
            }

            .description {
                font-size: 13px;
            }

            .info {
                width: 95%;
                gap: 35px;
            }

            .info h3 {
                font-size: 15px;
            }

            .info p {
                font-size: 10px;
            }

            footer {
                padding: 0 5%;
            }

        }

    </style>

</head>


<body>


    <header>

        <div class="logo">
            PENNY <span>&</span> CO.
        </div>

        <nav>

            <a href="#">HOME</a>

            <a href="#about">ABOUT</a>

            <a href="#contact">CONTACT</a>

        </nav>

    </header>


    <main class="main">

        <div class="tag">
            NODE.JS / WEB DEVELOPMENT
        </div>

        <h1>
            Welcome to
            <br>
            Penny <em>&</em> Co.
        </h1>

        <p class="description">
            A simple and elegant webpage designed using
            HTML and CSS and served with Node.js.
        </p>

        <button onclick="welcomeMessage()">
            GET STARTED
        </button>


        <div class="info" id="about">

            <div>

                <h3>About</h3>

                <p>
                    Simple web design
                    <br>
                    using Node.js.
                </p>

            </div>


            <div>

                <h3>Contact</h3>

                <p>
                    hello@pennyco.com
                    <br>
                    Mumbai, India
                </p>

            </div>

        </div>

    </main>


    <footer>

        <span>
            © 2026 PENNY & CO.
        </span>

        <span>
            NODE.JS PRACTICAL
        </span>

    </footer>


    <script>

        function welcomeMessage() {

            alert("Welcome to Penny & Co.!");

        }

    </script>


</body>

</html>
